name: Build GPUI Kit Xbox prototype
on:
  workflow_dispatch:
  push:
    branches: [xbox-prototype]
    paths:
      - examples/xbox-native-gpu/**
      - crates/kit/**
      - .github/workflows/xbox-build.yml
  pull_request:
    paths:
      - examples/xbox-native-gpu/**
      - .github/workflows/xbox-build.yml
permissions:
  contents: read
concurrency:
  group: xbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly with standard-library sources
        shell: pwsh
        run: |
          rustup toolchain install nightly-2026-09-30 --profile minimal --component rust-src
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            examples/xbox-native-gpu/ui/target
          key: xbox-rust-nightly-2026-09-30-${{ hashFiles('examples/xbox-native-gpu/ui/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            xbox-rust-nightly-2026-09-30-${{ hashFiles('examples/xbox-native-gpu/ui/Cargo.lock') }}-
      - name: Build and verify signed UWP package
        shell: pwsh
        run: ./examples/xbox-native-gpu/scripts/build.ps1
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            examples/xbox-native-gpu/ui/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-kit-xbox-x64
          path: examples/xbox-native-gpu/artifacts/
          if-no-files-found: error
